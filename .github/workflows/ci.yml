name: EGEAS validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reproduce frozen synthetic decisions
        working-directory: reproducibility
        run: python validate_bundle.py
      - name: Run reproducibility tests
        working-directory: reproducibility
        run: python -m unittest -v test_validate_bundle.py
      - name: Validate A+ protocol candidate
        working-directory: a_plus_protocol
        run: python -m unittest -v test_protocol.py

